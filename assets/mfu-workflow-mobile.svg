<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1100" role="img" aria-labelledby="title desc"><title id="title">多模态训练的 MFU 实时统计流程</title><desc id="desc">统计 Step 耗时、估算模型训练 FLOPs、获取集群硬件峰值算力，以相同全局口径计算 MFU 并记录日志。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#7c887f"/></marker></defs><rect width="100%" height="100%" fill="#f8f8f5"/><g font-family="'Helvetica Neue',Arial,'Microsoft YaHei',sans-serif"><text x="20" y="35" font-size="23" fill="#222" text-anchor="start" font-weight="400">MFU 实时统计流程</text><text x="20" y="60" font-size="13" fill="#777" text-anchor="start" font-weight="400">三类信息汇合，计算每个 Step 的效率</text><rect x="20" y="90" width="360" height="225" rx="6" fill="#fff" stroke="#d1d1ca"/><text x="38" y="117" font-size="11" fill="#7a827a" text-anchor="start" font-weight="400">01 / STEP TIMING</text><text x="38" y="149" font-size="21" fill="#222" text-anchor="start" font-weight="400">训练 Step 计时</text><text x="38" y="175" font-size="13" fill="#666" text-anchor="start" font-weight="400">on_step_begin → on_step_end</text><text x="38" y="207" font-size="13" fill="#666" text-anchor="start" font-weight="400">记录起点与终点</text><text x="38" y="230" font-size="12" fill="#666" text-anchor="start" font-weight="400">统计同一训练 Step 的耗时</text><path d="M38 248 H362" stroke="#ddd"/><text x="38" y="276" font-size="17" fill="#26372c" text-anchor="start" font-weight="400">Step 耗时 Δt</text><text x="38" y="299" font-size="13" fill="#58655c" text-anchor="start" font-weight="400">t_end − t_begin</text><path d="M200 316 V337" fill="none" stroke="#7c887f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="345" width="360" height="225" rx="6" fill="#fff" stroke="#d1d1ca"/><text x="38" y="372" font-size="11" fill="#7a827a" text-anchor="start" font-weight="400">02 / MODEL COMPUTE</text><text x="38" y="404" font-size="21" fill="#222" text-anchor="start" font-weight="400">多模态输入 × 模型结构</text><text x="38" y="430" font-size="13" fill="#666" text-anchor="start" font-weight="400">实际 Batch · Qwen / Gemma</text><text x="38" y="462" font-size="13" fill="#666" text-anchor="start" font-weight="400">文本 / 视觉 Token 与有效长度</text><text x="38" y="485" font-size="12" fill="#666" text-anchor="start" font-weight="400">适配 padding / padding-free / packing</text><path d="M38 503 H362" stroke="#ddd"/><text x="38" y="531" font-size="17" fill="#26372c" text-anchor="start" font-weight="400">模型训练 FLOPs</text><text x="38" y="554" font-size="13" fill="#58655c" text-anchor="start" font-weight="400">按输入与模型结构估算 F_step</text><path d="M200 571 V592" fill="none" stroke="#7c887f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="600" width="360" height="225" rx="6" fill="#fff" stroke="#d1d1ca"/><text x="38" y="627" font-size="11" fill="#7a827a" text-anchor="start" font-weight="400">03 / HARDWARE CAPACITY</text><text x="38" y="659" font-size="21" fill="#222" text-anchor="start" font-weight="400">硬件与训练精度</text><text x="38" y="685" font-size="13" fill="#666" text-anchor="start" font-weight="400">GPU 型号 · 数量 · 计算精度</text><text x="38" y="717" font-size="13" fill="#666" text-anchor="start" font-weight="400">读取对应精度的单卡峰值算力</text><text x="38" y="740" font-size="12" fill="#666" text-anchor="start" font-weight="400">汇总参与训练的 GPU 算力</text><path d="M38 758 H362" stroke="#ddd"/><text x="38" y="786" font-size="17" fill="#26372c" text-anchor="start" font-weight="400">集群峰值 FLOPs/s</text><text x="38" y="809" font-size="13" fill="#58655c" text-anchor="start" font-weight="400">P_cluster = Σ P_peak</text><path d="M200 825 V857" fill="none" stroke="#7c887f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="872" width="360" height="146" rx="6" fill="#eaf0e8" stroke="#b5c2b3"/><text x="200" y="903" font-size="21" fill="#26372c" text-anchor="middle" font-weight="400">计算并记录 Step MFU</text><text x="200" y="938" font-size="21" fill="#192b20" text-anchor="middle" font-weight="400">MFU = F_step</text><text x="200" y="968" font-size="19" fill="#192b20" text-anchor="middle" font-weight="400">÷ (Δt × P_cluster) × 100%</text><text x="200" y="998" font-size="13" fill="#58655c" text-anchor="middle" font-weight="400">P_cluster = Σ P_peak</text><text x="20" y="1050" font-size="12" fill="#777" text-anchor="start" font-weight="400">统一全局统计范围，避免并行重复计数。</text><text x="20" y="1076" font-size="12" fill="#777" text-anchor="start" font-weight="400">实际 Token · 模型结构 · TP / PP / CP</text></g></svg>