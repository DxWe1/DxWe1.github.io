<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 690" role="img" aria-labelledby="title desc"><title id="title">多模态训练的 MFU 实时统计流程</title><desc id="desc">统计 Step 耗时、估算模型训练 FLOPs、获取集群硬件峰值算力，以相同全局口径计算 MFU 并记录日志。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#7c887f"/></marker></defs><rect width="100%" height="100%" fill="#f8f8f5"/><g font-family="'Helvetica Neue',Arial,'Microsoft YaHei',sans-serif"><text x="30" y="42" font-size="25" fill="#222" text-anchor="start" font-weight="400">多模态训练 · MFU 实时统计</text><text x="30" y="68" font-size="14" fill="#777" text-anchor="start" font-weight="400">将输入、计时与硬件信息统一到同一个训练 Step</text><rect x="30" y="96" width="280" height="168" rx="6" fill="#fff" stroke="#d1d1ca"/><text x="48" y="122" font-size="11" fill="#7a827a" text-anchor="start" font-weight="400">01 / STEP TIMING</text><text x="48" y="155" font-size="20" fill="#222" text-anchor="start" font-weight="400">训练 Step 计时</text><text x="48" y="184" font-size="12" fill="#666" text-anchor="start" font-weight="400">on_step_begin → on_step_end</text><text x="48" y="218" font-size="12" fill="#666" text-anchor="start" font-weight="400">记录起点与终点</text><text x="48" y="241" font-size="12" fill="#666" text-anchor="start" font-weight="400">统计同一训练 Step 的耗时</text><path d="M170 265 V298" fill="none" stroke="#7c887f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="30" y="310" width="280" height="90" rx="6" fill="#eaf0e8" stroke="#b5c2b3"/><text x="170" y="347" font-size="19" fill="#26372c" text-anchor="middle" font-weight="400">Step 耗时 Δt</text><text x="170" y="377" font-size="13" fill="#58655c" text-anchor="middle" font-weight="400">t_end − t_begin</text><path d="M170 400 V430 H480" fill="none" stroke="#7c887f" stroke-width="1.6"/><rect x="340" y="96" width="280" height="168" rx="6" fill="#fff" stroke="#d1d1ca"/><text x="358" y="122" font-size="11" fill="#7a827a" text-anchor="start" font-weight="400">02 / MODEL COMPUTE</text><text x="358" y="155" font-size="20" fill="#222" text-anchor="start" font-weight="400">多模态输入 × 模型结构</text><text x="358" y="184" font-size="12" fill="#666" text-anchor="start" font-weight="400">实际 Batch · Qwen / Gemma</text><text x="358" y="218" font-size="12" fill="#666" text-anchor="start" font-weight="400">文本 / 视觉 Token 与有效长度</text><text x="358" y="241" font-size="12" fill="#666" text-anchor="start" font-weight="400">适配 padding / padding-free / packing</text><path d="M480 265 V298" fill="none" stroke="#7c887f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="340" y="310" width="280" height="90" rx="6" fill="#eaf0e8" stroke="#b5c2b3"/><text x="480" y="347" font-size="19" fill="#26372c" text-anchor="middle" font-weight="400">模型训练 FLOPs</text><text x="480" y="377" font-size="13" fill="#58655c" text-anchor="middle" font-weight="400">按输入与模型结构估算 F_step</text><path d="M480 400 V430 H480" fill="none" stroke="#7c887f" stroke-width="1.6"/><rect x="650" y="96" width="280" height="168" rx="6" fill="#fff" stroke="#d1d1ca"/><text x="668" y="122" font-size="11" fill="#7a827a" text-anchor="start" font-weight="400">03 / HARDWARE CAPACITY</text><text x="668" y="155" font-size="20" fill="#222" text-anchor="start" font-weight="400">硬件与训练精度</text><text x="668" y="184" font-size="12" fill="#666" text-anchor="start" font-weight="400">GPU 型号 · 数量 · 计算精度</text><text x="668" y="218" font-size="12" fill="#666" text-anchor="start" font-weight="400">读取对应精度的单卡峰值算力</text><text x="668" y="241" font-size="12" fill="#666" text-anchor="start" font-weight="400">汇总参与训练的 GPU 算力</text><path d="M790 265 V298" fill="none" stroke="#7c887f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="650" y="310" width="280" height="90" rx="6" fill="#eaf0e8" stroke="#b5c2b3"/><text x="790" y="347" font-size="19" fill="#26372c" text-anchor="middle" font-weight="400">集群峰值 FLOPs/s</text><text x="790" y="377" font-size="13" fill="#58655c" text-anchor="middle" font-weight="400">P_cluster = Σ P_peak</text><path d="M790 400 V430 H480" fill="none" stroke="#7c887f" stroke-width="1.6"/><path d="M480 430 V452" fill="none" stroke="#7c887f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="30" y="467" width="900" height="148" rx="6" fill="#fff" stroke="#9eaea0"/><text x="480" y="500" font-size="20" fill="#26372c" text-anchor="middle" font-weight="400">计算并记录 Step MFU</text><text x="480" y="541" font-size="24" fill="#192b20" text-anchor="middle" font-weight="400">MFU = F_step ÷ (Δt × P_cluster) × 100%</text><text x="480" y="580" font-size="14" fill="#666" text-anchor="middle" font-weight="400">同型号 GPU：P_cluster = N_GPU × P_peak</text><text x="30" y="647" font-size="13" fill="#777" text-anchor="start" font-weight="400">统计口径：F_step 与硬件算力按同一全局范围统计；TP / PP / CP 避免重复计数。</text></g></svg>